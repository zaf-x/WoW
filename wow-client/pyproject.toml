[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wow-client"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "zaf-x", email = "baoshuwen2013@outlook.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/zaf-x/wow-client#readme"
Issues = "https://github.com/zaf-x/wow-client/issues"
Source = "https://github.com/zaf-x/wow-client"

[tool.hatch.version]
path = "src/wow_client/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/wow_client tests}"

[tool.coverage.run]
source_pkgs = ["wow_client", "tests"]
branch = true
parallel = true
omit = [
  "src/wow_client/__about__.py",
]

[tool.coverage.paths]
wow_client = ["src/wow_client", "*/wow-client/src/wow_client"]
tests = ["tests", "*/wow-client/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
