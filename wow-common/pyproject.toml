[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wow-common"
dynamic = ["version"]
description = 'Shared wire protocol and TUN device helpers for the WoW VPN'
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["vpn", "tun", "tunnel"]
authors = [
  { name = "zaf-x", email = "baoshuwen2013@outlook.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/zaf-x/wow-common#readme"
Issues = "https://github.com/zaf-x/wow-common/issues"
Source = "https://github.com/zaf-x/wow-common"

[tool.hatch.version]
path = "src/wow_common/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/wow_common tests}"

[tool.coverage.run]
source_pkgs = ["wow_common", "tests"]
branch = true
parallel = true
omit = [
  "src/wow_common/__about__.py",
]

[tool.coverage.paths]
wow_common = ["src/wow_common", "*/wow-common/src/wow_common"]
tests = ["tests", "*/wow-common/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
