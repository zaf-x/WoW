[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wow-server"
dynamic = ["version"]
description = 'WoW VPN server: TLS gateway with a single shared TUN device and NAT'
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["vpn", "tun", "tunnel", "server", "nat"]
authors = [
  { name = "zaf-x", email = "baoshuwen2013@outlook.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "wow-common",
  "rich",
  "fastapi",
  "uvicorn",
  "tomlkit"
]

[project.scripts]
wow-server = "wow_server.__main__:main"

[project.urls]
Documentation = "https://github.com/zaf-x/WoW#readme"
Issues = "https://github.com/zaf-x/WoW/issues"
Source = "https://github.com/zaf-x/WoW"

[tool.hatch.version]
path = "src/wow_server/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/wow_server tests}"

[tool.coverage.run]
source_pkgs = ["wow_server", "tests"]
branch = true
parallel = true
omit = [
  "src/wow_server/__about__.py",
]

[tool.coverage.paths]
wow_server = ["src/wow_server", "*/wow-server/src/wow_server"]
tests = ["tests", "*/wow-server/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
